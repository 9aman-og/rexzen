name: Publish Rexzen second edition

on:
  push:
    branches: [main]
    paths:
      - rexzen-v2-source.tar.gz
      - .github/workflows/rexzen-pages.yml
      - google*.html
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rexzen-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source backup
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare and check the second edition
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path, PurePosixPath
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, urlunsplit, unquote
          import hashlib, json, os, re, shutil, subprocess, tarfile
          
          ARCHIVE = Path(os.environ.get('REXZEN_SOURCE_ARCHIVE', 'rexzen-v2-source.tar.gz'))
          OUTPUT = Path(os.environ.get('REXZEN_PAGES_OUT', '_site'))
          EXPECTED = '2e889a11b0675154cc395eb48eccb06a344f49ee2f4f6395613c273a95d3a6ec'
          ORIGIN = 'https://9aman-og.github.io'
          BASE = '/rexzen'
          SOURCE_COMMIT = 'e857d7a61b64654a7fb05376b6f082498429e736'
          NAMES = ['', 'projects', 'focus', 'rex-wm', '2piarc', 'eos', 'research', 'about', 'privacy', 'aman-agarwal']
          ROUTES = {'/2/' + name: '2/' + (name + '/' if name else '') + 'index.html' for name in NAMES}
          SHARED = ('brand/', 'images/', 'media/', 'paper-files/', 'releases/')
          SHARED_FILES = {'character-film-v30.gz', 'character-study-v30.json', 'research-papers.js', 'research-papers.css', 'research-catalog.json'}
          
          assert hashlib.sha256(ARCHIVE.read_bytes()).hexdigest() == EXPECTED, 'Source archive checksum mismatch'
          files = {}
          metadata_source = None
          text_source = None
          with tarfile.open(ARCHIVE) as source:
              for entry in source.getmembers():
                  if not entry.isfile():
                      assert not entry.issym() and not entry.islnk(), 'Links are not allowed in source'
                      continue
                  path = PurePosixPath(entry.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  if entry.name == 'rexzen-site/scripts/rebuild-metadata.mjs':
                      metadata_source = source.extractfile(entry).read().decode()
                  elif entry.name == 'rexzen-site/scripts/build.mjs':
                      build_source = source.extractfile(entry).read().decode()
                      text_source = build_source[build_source.index('function decodeText('):build_source.index('function metadata(')]
                  prefix = 'rexzen-site/public/'
                  if not entry.name.startswith(prefix):
                      continue
                  name = entry.name[len(prefix):]
                  if name.startswith(('2/',) + SHARED) or name in SHARED_FILES:
                      files[name] = source.extractfile(entry).read()
          
          # Apply the same reviewed metadata and text generators as the original build.
          # The static export must include generated content, not only raw public files.
          assert metadata_source and text_source
          metadata_driver = metadata_source + '\n' + text_source + r'''
          const {readFileSync}=await import('node:fs');
          const input=JSON.parse(readFileSync(0,'utf8'));
          const result={}, texts=[];
          for(const [name,raw] of Object.entries(input.pages)){
            const route=rebuildRoutes.get(name.slice(2));
            if(route===undefined)throw new Error('Unknown public page: '+name);
            const html=rebuildMetadata(raw.replace(/(<link rel="canonical" href=")\/(.*?)"/g,'$1https://rexzen.si/$2"'),route,input.catalog);
            result[name]=html;
            const text=pageText(html.replace(/<br\s*\/?>/gi,' '),'/2'+route);
            result[route==='/'?'2/index.md':'2'+route+'.md']=text;
            texts.push(text);
          }
          result['2/llms-full.txt']='# Rexzen second-edition public pages\n\nPrivate workspace content is not included.\n\n'+texts.join('\n\n---\n\n');
          process.stdout.write(JSON.stringify(result));
          '''
          generated = subprocess.run(
              [os.environ.get('REXZEN_NODE', 'node'), '--input-type=module', '-e', metadata_driver],
              input=json.dumps({'pages': {name: body.decode() for name, body in files.items() if name.startswith('2/') and name.endswith('.html')}, 'catalog': json.loads(files['research-catalog.json'])}),
              text=True, capture_output=True, check=True,
          )
          files.update({name: body.encode() for name, body in json.loads(generated.stdout).items()})
          
          def mapped(value):
              parsed = urlsplit(value)
              absolute = bool(parsed.netloc)
              if absolute and parsed.netloc != 'rexzen.si':
                  return value
              path = parsed.path
              canonical_route = path.rstrip('/')
              if canonical_route == '/2/index.html':
                  canonical_route = '/2'
              if canonical_route.endswith('.html') and canonical_route[:-5] in ROUTES:
                  canonical_route = canonical_route[:-5]
              route_key = '/2/' if canonical_route == '/2' else canonical_route
              if route_key in ROUTES:
                  path = BASE + route_key.rstrip('/') + '/'
              elif path.lstrip('/') in files:
                  path = BASE + path
              elif path == '/robots.txt':
                  path = BASE + path
              elif not absolute and (path == '/aero' or path.startswith(('/aero/', '/api/'))):
                  return urlunsplit(('https', 'rexzen.si', path, parsed.query, parsed.fragment))
              else:
                  return value
              return urlunsplit(('https' if absolute else '', '9aman-og.github.io' if absolute else '', path, parsed.query, parsed.fragment))
          
          URLS = re.compile(r'''(?P<before>[\"'`(\s=>])(?P<url>https://rexzen\.si/[^\s\"'`<>)]*|/(?!/)[^\s\"'`<>)]*)''')
          def rewrite(text):
              return URLS.sub(lambda match: match['before'] + mapped(match['url']), text)
          
          if OUTPUT.exists():
              assert OUTPUT.is_dir() and not OUTPUT.is_symlink()
              shutil.rmtree(OUTPUT)
          OUTPUT.mkdir(parents=True)
          pages = {}
          for name, content in files.items():
              destination = name
              if name.startswith('2/') and name.endswith('.html'):
                  route = '/2/' if name == '2/index.html' else '/2/' + PurePosixPath(name).stem
                  assert route in ROUTES, name
                  destination = ROUTES[route]
              editable = name.startswith('2/') and '/vendor/' not in name or name in {'research-papers.js', 'research-papers.css', 'research-catalog.json'}
              if editable and Path(name).suffix in {'.html', '.css', '.js', '.json', '.xml', '.txt', '.svg', '.md'}:
                  content = rewrite(content.decode()).encode()
              target = OUTPUT / destination
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
              if destination.endswith('.html'):
                  pages[destination] = content.decode()
          
          home = ORIGIN + BASE + '/2/'
          (OUTPUT / 'index.html').write_text('<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rexzen</title><link rel="canonical" href="' + home + '"><meta http-equiv="refresh" content="0;url=' + BASE + '/2/"><p><a href="' + BASE + '/2/">Open Rexzen</a></p></html>')
          (OUTPUT / '404.html').write_text('<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Page not found | Rexzen</title><link rel="stylesheet" href="' + BASE + '/2/interface.css"><main class="wrap section"><h1>Page not found.</h1><p>This address does not have a page.</p><a href="' + BASE + '/2/">Return to Rexzen</a></main></html>')
          (OUTPUT / '.nojekyll').touch()
          (OUTPUT / 'robots.txt').write_text('User-agent: *\nAllow: /\nSitemap: ' + ORIGIN + BASE + '/2/sitemap.xml\n')
          shutil.copyfile(OUTPUT / '2/sitemap.xml', OUTPUT / 'sitemap.xml')
          shutil.copyfile(OUTPUT / '2/llms.txt', OUTPUT / 'llms.txt')
          for verification in Path('.').glob('google*.html'):
              if re.fullmatch(r'google[a-f0-9]+\.html', verification.name):
                  content = verification.read_text().strip()
                  assert content == 'google-site-verification: ' + verification.name
                  (OUTPUT / verification.name).write_text(content + '\n')
          
          class Page(HTMLParser):
              def __init__(self, text):
                  super().__init__()
                  self.references, self.ids, self.canonical = [], set(), []
                  self.metadata, self.schemas = {}, []
                  self.json_ld = None
                  self.feed(text)
              def handle_starttag(self, tag, attributes):
                  attrs = dict(attributes)
                  if attrs.get('id'):
                      self.ids.add(attrs['id'])
                  if tag == 'link' and attrs.get('rel') == 'canonical':
                      self.canonical.append(attrs.get('href'))
                  if tag == 'meta':
                      key = attrs.get('property') or attrs.get('name')
                      self.metadata[key] = attrs.get('content')
                      if key in {'og:image', 'twitter:image'}:
                          self.references.append(attrs.get('content'))
                  if tag == 'script' and attrs.get('type') == 'application/ld+json':
                      self.json_ld = ''
                  for key, value in attributes:
                      if value and (key in {'href', 'src', 'poster'} or key in {'data-src', 'data-src-mobile', 'data-poster-mobile', 'data-paper-file'}):
                          self.references.append(value)
              def handle_data(self, data):
                  if self.json_ld is not None:
                      self.json_ld += data
              def handle_endtag(self, tag):
                  if tag == 'script' and self.json_ld is not None:
                      self.schemas.append(json.loads(self.json_ld))
                      self.json_ld = None
          
          parsed_pages = {name: Page(text) for name, text in pages.items()}
          references_checked = 0
          for name, page in parsed_pages.items():
              for value in page.references:
                  url = urlsplit(value)
                  if url.netloc and url.netloc != '9aman-og.github.io':
                      continue
                  if not url.path.startswith(BASE + '/'):
                      assert not url.path.startswith('/'), (name, value, 'Unmapped root path')
                      continue
                  path = unquote(url.path[len(BASE) + 1:])
                  target = OUTPUT / path
                  if target.is_dir():
                      target /= 'index.html'
                  assert target.is_file(), (name, value, 'Missing target')
                  if url.fragment and target.suffix == '.html':
                      target_name = target.relative_to(OUTPUT).as_posix()
                      assert unquote(url.fragment) in parsed_pages[target_name].ids, (name, value, 'Missing anchor')
                  references_checked += 1
              route_path = '/' + name.removesuffix('index.html')
              assert page.canonical == [ORIGIN + BASE + route_path], (name, page.canonical)
              assert page.metadata['og:url'] == page.canonical[0]
              assert page.metadata['twitter:card'] == 'summary_large_image'
              assert page.metadata['robots'] == 'index, follow, max-image-preview:large'
              assert len(page.schemas) == 1
              assert any(node.get('url') == page.canonical[0] and node.get('@type') in {'WebPage', 'CollectionPage', 'ProfilePage'} for node in page.schemas[0]['@graph'])
              assert 'href="/aero"' not in pages[name]
          assert len(parsed_pages) == 10
          profile = parsed_pages['2/aman-agarwal/index.html']
          profile_node = next(node for node in profile.schemas[0]['@graph'] if node.get('@type') == 'ProfilePage')
          assert profile_node['mainEntity']['@type'] == 'Person'
          assert profile_node['mainEntity']['name'] == 'Aman Agarwal'
          assert profile_node['mainEntity']['sameAs'] == ['https://github.com/9aman-og']
          assert profile_node['mainEntity']['url'] == profile.canonical[0]
          text_references_checked = 0
          for index in ['2/llms.txt', '2/llms-full.txt']:
              for value in re.findall(r'https://9aman-og\.github\.io/rexzen/[^\s)]+', (OUTPUT / index).read_text()):
                  path = OUTPUT / unquote(urlsplit(value).path[len(BASE) + 1:])
                  if path.is_dir():
                      path /= 'index.html'
                  assert path.is_file(), (index, value, 'Missing text index target')
                  text_references_checked += 1
              assert 'https://rexzen.si/2/' not in (OUTPUT / index).read_text()
          assert "fetch('/rexzen/character-film-v30.gz')" in (OUTPUT / '2/character-scene.js').read_text()
          assert "'/rexzen/2/projects/'" in (OUTPUT / '2/page-transition.js').read_text()
          assert 'https://rexzen.si/2/' not in (OUTPUT / '2/sitemap.xml').read_text()
          assert not any((OUTPUT / path).exists() for path in ['2/library', '2/research/rex-wm-sensor-noise', '2/research/persistent-model-growth'])
          report = {'source_commit': SOURCE_COMMIT, 'archive_sha256': EXPECTED, 'route_count': len(parsed_pages), 'references_checked': references_checked, 'text_references_checked': text_references_checked, 'structured_data_pages': len(parsed_pages), 'profile_schema_verified': True, 'canonical_home': home, 'github_commit': os.environ.get('GITHUB_SHA'), 'files': len([path for path in OUTPUT.rglob('*') if path.is_file()])}
          (OUTPUT / 'build-info.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PYTHON
      - name: Upload public website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
