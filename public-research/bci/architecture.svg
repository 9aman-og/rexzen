<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 377" width="592" height="377" role="img" aria-labelledby="atitle arrdesc"><title id="atitle">Rexzen sensing, inference and authorization topology</title><desc id="arrdesc">The sensor reaches isolated acquisition, then the phone. Only user-confirmed text can flow to an optional model. No GPT command can directly actuate a device.</desc>
