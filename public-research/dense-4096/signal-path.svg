<svg xmlns="http://www.w3.org/2000/svg" width="623" height="305" viewBox="0 0 623 305" role="img" aria-labelledby="a b"><title id="a">D4096 architecture</title><desc id="b">Independent sensor inputs acquire on local analog front end tiles and aggregate in eight sectors. The isolated pocket hub stores optional raw data and sends feature summaries for local confirmed actions.</desc>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#34524d" stroke-width=".45"/></pattern><marker id="arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0l7 3-7 3Z" fill="#8bb7a8"/></marker></defs>
<rect width="623" height="305" rx="8" fill="#132721"/><rect width="623" height="305" rx="8" fill="url(#grid)"/>
<g fill="none" stroke="#8bb7a8" stroke-width="1.5"><path d="M191 97h23" marker-end="url(#arrow)"/><path d="M384 97h23" marker-end="url(#arrow)"/><path d="M505 131v51" marker-end="url(#arrow)"/><path d="M410 219h-23" marker-end="url(#arrow)"/><path d="M217 219h-23" marker-end="url(#arrow)"/></g><g font-family="Segoe UI, Arial, sans-serif"><text x="23" y="34" font-size="14" fill="#abd3b9" letter-spacing="1.4">D4096 / DOUBLE-CHECK EVERY LANE</text><rect x="23" y="63" width="168" height="68" rx="7" fill="#15282d" stroke="#22d3ee"/><text x="35" y="89" font-size="15" font-weight="700" fill="#ebf6ef">Sensor islands</text><text x="35" y="112" font-size="10.7" fill="#c0d5ce">64 contacts × 64 tiles</text><rect x="217" y="63" width="167" height="68" rx="7" fill="#15282d" stroke="#34d399"/><text x="229" y="89" font-size="15" font-weight="700" fill="#ebf6ef">Local AFE tiles</text><text x="229" y="112" font-size="10.7" fill="#c0d5ce">Aperture and gain calibrated</text><rect x="410" y="63" width="190" height="68" rx="7" fill="#15282d" stroke="#fbbf24"/><text x="422" y="89" font-size="15" font-weight="700" fill="#ebf6ef">8 sector concentrators</text><text x="422" y="112" font-size="10.7" fill="#c0d5ce">Clock, health and reassembly</text><rect x="410" y="185" width="190" height="68" rx="7" fill="#15282d" stroke="#fbbf24"/><text x="422" y="211" font-size="15" font-weight="700" fill="#ebf6ef">Pocket hub</text><text x="422" y="234" font-size="10.7" fill="#c0d5ce">Isolated link; raw off by default</text><rect x="217" y="185" width="167" height="68" rx="7" fill="#15282d" stroke="#a78bfa"/><text x="229" y="211" font-size="15" font-weight="700" fill="#ebf6ef">Local decoder</text><text x="229" y="234" font-size="10.7" fill="#c0d5ce">Validity and mask before scores</text><rect x="23" y="185" width="168" height="68" rx="7" fill="#15282d" stroke="#fb7185"/><text x="35" y="211" font-size="15" font-weight="700" fill="#ebf6ef">Confirmed action</text><text x="35" y="234" font-size="10.7" fill="#c0d5ce">Review / confirm / expire</text><text x="23" y="281" fill="#c0d5ce" font-size="12">Shared clock and primary / backup reference • no raw EEG to GPT • no stimulation</text></g></svg>